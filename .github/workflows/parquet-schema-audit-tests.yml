name: Parquet schema audit offline tests

on:
  pull_request:
    paths:
      - 'infra/audit/production_parquet_schema_audit.py'
      - 'tests/test_production_parquet_schema_audit.py'
      - 'tests/test_parquet_schema_audit_workflow.py'
      - 'docs/parquet-schema-audit-v1.md'
      - '.github/workflows/production-parquet-schema-audit.yml'
      - '.github/workflows/parquet-schema-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 pyarrow==19.0.1 PyYAML==6.0.2
      - name: Compile standalone audit
        run: python -m py_compile infra/audit/production_parquet_schema_audit.py
      - name: Run offline audit and workflow safety tests
        run: python -m pytest -q tests/test_production_parquet_schema_audit.py tests/test_parquet_schema_audit_workflow.py
