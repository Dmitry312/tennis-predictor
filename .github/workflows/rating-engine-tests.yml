name: Offline Rating Engine
on:
  pull_request:
    branches: [ML]
    paths:
      - 'src/tennis_predictor/ml/**'
      - 'scripts/*ratings.py'
      - 'tests/test_ratings.py'
      - '.github/workflows/rating-engine-tests.yml'
  push:
    branches: [ml-rating-engine-v1]

permissions:
  contents: read

jobs:
  ratings:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check uv==0.13.9
          uv sync --locked
      - run: |
          .venv/bin/ruff check src/tennis_predictor/ml/ratings scripts/{run,benchmark}_ratings.py tests/test_ratings.py
          .venv/bin/ruff format --check src/tennis_predictor/ml/ratings scripts/{run,benchmark}_ratings.py tests/test_ratings.py
          .venv/bin/python -m pytest -q tests/test_ratings.py tests/test_match_data.py tests/test_bulk_identity_integration.py
          .venv/bin/python scripts/benchmark_ratings.py --matches 2000
