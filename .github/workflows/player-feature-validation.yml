name: Player Feature Engine E04 historical validation
on:
  workflow_dispatch:
  push:
    branches: [ml-player-feature-engine-v1]
    paths: ['.github/workflows/player-feature-validation.yml']

permissions:
  contents: read

concurrency:
  group: production-e04-readonly
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'Dmitry312/tennis-predictor'
    environment: player-identity-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/historical-baselines"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir "$ROOT" "$ROOT/report"
          python -m pip install --disable-pip-version-check uv==0.13.9
          uv sync --locked --group baseline
      - name: Freeze bounded metadata, score and statistics evidence
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && -n "$SSH_KEY" ]]
          [[ "$SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/baselines-ssh.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          timeout 15s ssh-keyscan -T 10 -p 22 -t ed25519 -- "$SSH_HOST" > "$work/candidate" 2>/dev/null
          awk 'NF == 3 && $2 == "ssh-ed25519" { print; count++ }
               END { if (count != 1) exit 1 }' "$work/candidate" > "$work/known_hosts"
          [[ "$(ssh-keygen -lf "$work/known_hosts" -E sha256 | awk '{print $2}')" == "$SSH_FINGERPRINT" ]]
          printf '%s\n' "$SSH_KEY" > "$work/key"
          unset SSH_KEY
          export PLAYER_REVIEW_SSH_DIR="$work"
          BASELINE_SSH_COMMAND=$(cat <<'SH'
          set -eu
          umask 077
          printf '%s\n' '{"stage":"bootstrap"}'
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          tar -xf - -C "$work"
          cd /root/Tennis_pelmen_model
          timeout --kill-after=10s 2150s .venv/bin/python -B "$work/scripts/export_historical_baselines.py" --remote --validation-only --with-stats
          SH
          )
          export BASELINE_SSH_COMMAND
          git archive HEAD src scripts |
            .venv/bin/python scripts/export_historical_baselines.py "$ROOT/source" --validation-only --with-stats
      - name: Seal validation-only source when an encryption secret is available
        env:
          SNAPSHOT_PASSPHRASE: ${{ secrets.BASELINE_SNAPSHOT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$SNAPSHOT_PASSPHRASE" ]]; then
            echo 'Only aggregated E04 metrics will be retained. Source encryption is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tar -czf "$ROOT/frozen.tar.gz" -C "$ROOT/source" \
            source.json metadata.jsonl details.jsonl stats.jsonl registry.sqlite
          printf '%s\n' "$SNAPSHOT_PASSPHRASE" |
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              --output "$ROOT/frozen.tar.gz.gpg" "$ROOT/frozen.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e04-frozen-validation-source
          path: ${{ env.ROOT }}/frozen.tar.gz.gpg
          retention-days: 7
          if-no-files-found: ignore
      - name: Measure the lift over the accepted rating-only baselines
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_player_features.py --source "$ROOT/source" --output "$ROOT/features" > "$ROOT/report/E04.json"
          jq '{targets, snapshot: .source.snapshot, elapsed_seconds, window_replay_seconds,
            models: (.models | map_values({selection, matched_targets,
              losses: (.outer | map_values({log_loss: .full.all.log_loss, delta}))}))}' \
            "$ROOT/report/E04.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: player-feature-e04-metrics
          path: ${{ env.ROOT }}/report
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: rm -rf -- "$ROOT"
