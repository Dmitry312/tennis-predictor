name: ML catalog semantic audit tests
on:
  pull_request:
    branches: [ML]
    paths:
      - 'scripts/audit_ml_catalog.py'
      - 'tests/test_ml_catalog_audit.py'
      - 'docs/ml/**'
      - '.github/workflows/ml-catalog-audit-tests.yml'
permissions:
  contents: read
jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5
      - name: Run deterministic read-only catalog audit
        run: python -I -S scripts/audit_ml_catalog.py > /tmp/ml-catalog-audit.json
      - run: python -m pytest -q tests/test_ml_catalog_audit.py
