name: Real match sample export tests
on:
  pull_request:
    branches: [ML]
    paths:
      - 'scripts/export_match_samples.py'
      - 'tests/test_export_match_samples.py'
      - 'infra/audit/full_match_export.py'
      - 'docs/ml/data_catalog/**'
      - '.github/workflows/real-match-sample-tests.yml'
permissions:
  contents: read
concurrency:
  group: real-match-samples-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest==8.3.5 PyYAML==6.0.2
      - run: python -m py_compile scripts/export_match_samples.py
      - run: python -m pytest -q tests/test_export_match_samples.py tests/test_full_match_export.py tests/test_linked_record_review.py
