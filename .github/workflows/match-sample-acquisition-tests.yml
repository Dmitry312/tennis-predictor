name: Match sample acquisition offline tests
on:
  pull_request:
    branches: [ML]
    paths:
      - 'scripts/*sample*.py'
      - 'infra/audit/sample_acquisition_bootstrap.py'
      - 'infra/audit/full_match_export.py'
      - 'tests/test_sample_acquisition.py'
      - 'tests/test_export_match_samples.py'
      - '.github/workflows/*sample*.yml'
      - 'docs/ml/data_catalog/**'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest==8.3.5 PyYAML==6.0.2 cryptography==44.0.3
      - run: python -m compileall -q scripts/acquire_match_samples.py scripts/build_sample_acquisition_payload.py scripts/sample_delivery.py infra/audit/sample_acquisition_bootstrap.py
      - run: python -m pytest -q tests/test_sample_acquisition.py tests/test_export_match_samples.py tests/test_full_match_export.py tests/test_linked_record_review.py
