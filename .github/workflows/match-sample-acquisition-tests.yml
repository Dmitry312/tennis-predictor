name: Match sample acquisition offline tests
on:
  pull_request:
    branches: [ML]
    paths:
      - 'scripts/*sample*.py'
      - 'scripts/review_staging.py'
      - 'infra/audit/sample_acquisition_bootstrap.py'
      - 'infra/audit/sample_ssh.sh'
      - 'infra/audit/sample_diagnostics.py'
      - 'tests/test_sample_diagnostics_stdlib.py'
      - 'tests/test_sample_postgres16.py'
      - 'tests/test_sample_publication.py'
      - 'infra/audit/full_match_export.py'
      - 'tests/test_sample_acquisition.py'
      - 'tests/test_export_match_samples.py'
      - '.github/workflows/*sample*.yml'
      - 'docs/ml/data_catalog/**'
permissions:
  contents: read
jobs:
  clean-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bbdd705ebdeeb12d312848a4df6831212ecd8478
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependency-free current and historical runner plus fake SSH
        env:
          BASELINE_DIR: baseline
        run: python -I -S tests/test_sample_diagnostics_stdlib.py
  offline-tests:
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: offline-fixture-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENBLAS_NUM_THREADS: '1'
      SAMPLE_TEST_POSTGRES: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: offline-fixture-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest==8.3.5 PyYAML==6.0.2 cryptography==44.0.3
      - run: python -m compileall -q scripts/acquire_match_samples.py scripts/build_sample_acquisition_payload.py scripts/sample_delivery.py scripts/review_staging.py scripts/publish_match_samples.py scripts/sample_workflow_request.py scripts/sample_workflow_capture.py infra/audit/sample_acquisition_bootstrap.py infra/audit/sample_diagnostics.py
      - run: python -m pytest -q tests/test_sample_postgres16.py tests/test_sample_publication.py tests/test_sample_acquisition.py tests/test_export_match_samples.py tests/test_full_match_export.py tests/test_linked_record_review.py
