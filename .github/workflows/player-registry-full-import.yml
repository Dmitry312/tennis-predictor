name: Verify full player registry import

on:
  push:
    branches: [ml-registry-integration-v1]
    paths: ['.github/workflows/player-registry-full-import.yml']
  workflow_dispatch:
    inputs:
      saved_evidence_artifact_id:
        description: Optional same-repository Actions artifact with the saved evidence.sqlite
        type: string
        required: false
        default: '15140813328'
      use_saved_evidence_url:
        description: Read saved evidence.sqlite from the SAVED_PLAYER_EVIDENCE_URL secret
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check uv==0.13.9
          uv sync --locked
      - name: Import and validate without production access
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ARTIFACT: ${{ inputs.saved_evidence_artifact_id || '15140813328' }}
          USE_SAVED_EVIDENCE: ${{ inputs.use_saved_evidence_url }}
          SAVED_EVIDENCE_URL: ${{ inputs.use_saved_evidence_url && secrets.SAVED_PLAYER_EVIDENCE_URL || '' }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$EVIDENCE_ARTIFACT" =~ ^[0-9]+$ ]]
          work="$RUNNER_TEMP/player-registry"
          mkdir -p "$work/input" "$work/output"
          if [[ "$USE_SAVED_EVIDENCE" == true ]]; then
            [[ "$SAVED_EVIDENCE_URL" == https://* ]]
            curl --fail --silent --location --proto '=https' --proto-redir '=https' \
              --max-time 600 --max-filesize 1073741824 \
              --output "$work/input/evidence.sqlite" -- "$SAVED_EVIDENCE_URL"
          fi
          unset SAVED_EVIDENCE_URL
          .venv/bin/python scripts/import_approved_registry.py --verify-repeat \
            --saved-evidence-artifact "$EVIDENCE_ARTIFACT" \
            --evidence "$work/input/evidence.sqlite" \
            --registry "$work/output/registry.sqlite" | tee "$work/output/acceptance.json"
          cat "$work/output/acceptance.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Deliver compact registry and acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-player-registry-${{ github.run_id }}
          path: ${{ runner.temp }}/player-registry/output
          retention-days: 1
          if-no-files-found: error
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/player-registry"
