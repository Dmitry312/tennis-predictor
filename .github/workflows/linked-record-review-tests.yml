name: Linked sanitized record review offline tests

on:
  pull_request:
    branches: [ML]
    paths:
      - 'infra/audit/linked_record_review.py'
      - 'tests/test_linked_record_review.py'
      - 'docs/ml/data_catalog/**'
      - '.github/workflows/linked-record-review-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5 PyYAML==6.0.2
      - run: python -m py_compile infra/audit/linked_record_review.py
      - name: Run offline linked exporter and existing review regressions
        run: python -m pytest -q tests/test_linked_record_review.py tests/test_parquet_row_review.py tests/test_full_match_export.py
