name: Player identity review offline tests

on:
  pull_request:
    branches: [ML]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IDENTITY_SOURCE: catalog
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check uv==0.13.9
          uv sync --locked --group review
      - run: |
          .venv/bin/ruff check src/tennis_predictor/ml/identity_review scripts/{prepare,apply}_player_review.py scripts/export_live_player_review.py scripts/import_approved_registry.py scripts/player_registry_s3.py tests/test_registry_publication.py tests/test_identity_review.py tests/test_bulk_identity_integration.py
          .venv/bin/python -m pytest -q tests/test_identity_review.py tests/test_canonical_player_identity.py tests/test_bulk_identity_integration.py tests/test_registry_publication.py
          .venv/bin/python scripts/prepare_player_review.py --output "$RUNNER_TEMP/identity-review"
