name: NB-Bet surface collector tests

on:
  pull_request:
    paths:
      - 'src/tennis_predictor/ingestion/nbbet/details.py'
      - 'src/tennis_predictor/ingestion/nbbet/detail_job.py'
      - 'tests/test_nbbet_surface.py'
      - 'tests/test_nbbet_surface_postgres.py'
      - 'tests/probe_nbbet_surface_live.py'
      - '.github/workflows/nbbet-surface-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Compile modified modules
        run: python -m py_compile src/tennis_predictor/ingestion/nbbet/details.py src/tennis_predictor/ingestion/nbbet/detail_job.py
      - name: Run offline regression tests
        run: python -m pytest -q tests/test_nbbet_surface.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: surface_test
          POSTGRES_USER: surface_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surface_test -d surface_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Verify SQL writes against disposable PostgreSQL
        env:
          NBBET_SURFACE_TEST_DATABASE_URL: postgresql+psycopg2://surface_test:test_only_password@127.0.0.1:5432/surface_test
        run: python -m pytest -q tests/test_nbbet_surface_postgres.py

  live-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Probe public pages without persistence
        continue-on-error: true
        run: python tests/probe_nbbet_surface_live.py
