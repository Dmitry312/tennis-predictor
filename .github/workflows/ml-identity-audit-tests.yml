name: ML identity audit offline tests

on:
  pull_request:
    branches:
      - ML
    paths:
      - 'src/tennis_predictor/ingestion/nbbet/identity_audit.py'
      - 'tests/test_identity_audit.py'
      - '.github/workflows/ml-identity-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install audit test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5
      - name: Syntax check
        run: python -m py_compile src/tennis_predictor/ingestion/nbbet/identity_audit.py
      - name: Run synthetic audit tests
        run: python -m pytest -q tests/test_identity_audit.py
