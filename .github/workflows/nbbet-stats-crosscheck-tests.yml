name: NBBet statistics crosscheck offline tests

on:
  pull_request:
    paths:
      - 'src/tennis_predictor/ingestion/nbbet/stats_crosscheck.py'
      - 'tests/test_nbbet_stats_crosscheck.py'
      - '.github/workflows/nbbet-stats-crosscheck-tests.yml'
      - 'docs/nbbet-stats-crosscheck.md'
      - '.github/workflows/production-nbbet-stats-crosscheck-dry-run.yml'
      - 'tests/test_nbbet_stats_crosscheck_dry_run_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5 PyYAML==6.0.2
      - name: Compile pipeline
        run: python -m py_compile src/tennis_predictor/ingestion/nbbet/stats_crosscheck.py
      - name: Test crosscheck
        run: python -m pytest -q tests/test_nbbet_stats_crosscheck.py tests/test_nbbet_stats_crosscheck_dry_run_workflow.py
