name: Canonical match and player identity offline tests

on:
  pull_request:
    branches: [ML]
    paths:
      - 'src/tennis_predictor/ml/**'
      - 'tests/test_canonical_player_identity.py'
      - 'tests/test_canonical_match.py'
      - 'docs/ml/canonical-match.md'
      - 'docs/ml/registry-bootstrap-design.md'
      - 'docs/ml/canonical-player-identity.md'
      - 'docs/ml/identity-audit-evidence.md'
      - '.github/workflows/canonical-player-identity-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5 PyYAML==6.0.2
      - name: Compile offline foundation
        run: python -m py_compile src/tennis_predictor/ml/player_identity.py src/tennis_predictor/ml/canonical_match.py
      - name: Run synthetic identity tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_canonical_player_identity.py tests/test_canonical_match.py tests/test_identity_audit.py tests/test_player_identity_s3_audit.py tests/test_match_score_validation.py
