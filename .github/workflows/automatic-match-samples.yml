name: Automatic sports samples to ML PR
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        type: string
        required: true
        description: Exact reviewed ML code SHA
      batch_size:
        type: string
        default: '2'
        description: Initial 2, maximum 5; continues the persisted first-20 plan
      selection_plan:
        type: string
        default: ''
        description: Optional tracked acquisition-plans JSON if more than one plan exists
      source_manifest:
        type: string
        default: ''
        description: Optional tracked exact S3 history manifest
      allow_existing_root:
        type: boolean
        default: false
        description: Reuse the existing root runtime only when necessary
permissions:
  contents: read
concurrency:
  group: production-match-sample-acquisition
  cancel-in-progress: false
env:
  REVIEWED_SHA: ${{ inputs.reviewed_sha }}
  SELECTED_SHA: ${{ github.sha }}
  PROJECT_PATH: ${{ vars.SAMPLES_PROJECT_PATH || '/root/Tennis_pelmen_model' }}
  ALLOW_EXISTING_ROOT: ${{ inputs.allow_existing_root }}
  STAGE_TICKET: gh-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  samples-to-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ML' }}
    environment: match-sample-review
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Resolve safe continuation and block pending sample PRs before SSH
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SELECTION_PLAN: ${{ inputs.selection_plan }}
        run: python -I -S scripts/sample_progress.py
      - name: Acquire bounded read-only sources with no GitHub token
        env:
          OPERATION: automatic
          BATCH_SIZE: ${{ inputs.batch_size }}
          MANIFEST_PATH: ${{ inputs.source_manifest }}
          SAMPLE_ARCHIVE: ${{ runner.temp }}/automatic-sample.zip
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
        run: bash infra/audit/sample_ssh.sh
      - name: Validate and create catalog JSON branch and PR under standing owner policy
        env:
          SAMPLE_ARCHIVE: ${{ runner.temp }}/automatic-sample.zip
          GH_TOKEN: ${{ github.token }}
        run: python -I -S scripts/publish_match_samples.py --automatic
      - name: Clean runner transport bytes
        if: ${{ always() }}
        shell: bash
        env:
          SAMPLE_ARCHIVE: ${{ runner.temp }}/automatic-sample.zip
        run: rm -f -- "$SAMPLE_ARCHIVE"
