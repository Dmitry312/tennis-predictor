name: Automatic sports samples to ML PR
on:
  workflow_dispatch:
    inputs:
      selection_plan:
        type: string
        default: ''
        required: false
        description: Advanced only; leave empty for automatic persisted-plan discovery
      source_manifest:
        type: string
        default: ''
        required: false
        description: Advanced only; optional tracked exact S3 history manifest
permissions:
  contents: read
concurrency:
  group: production-match-sample-acquisition
  cancel-in-progress: false
env:
  REVIEWED_SHA: ${{ github.sha }}
  SELECTED_SHA: ${{ github.sha }}
  PROJECT_PATH: ${{ vars.SAMPLES_PROJECT_PATH || '/root/Tennis_pelmen_model' }}
  # Standing permission for this workflow's existing runtime; no new privileges.
  ALLOW_EXISTING_ROOT: 'true'
  # Versioned standard batch, also inherited by progress resolution and SSH request.
  BATCH_SIZE: '5'
  PLAN_OPERATION: 'true'
  STAGE_TICKET: gh-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  samples-to-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ML' }}
    environment: match-sample-review
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Resolve safe continuation and block pending sample PRs before SSH
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION_PLAN: ${{ inputs.selection_plan }}
        run: python -I -S scripts/sample_progress.py
      - name: Complete remaining plan in sequential bounded batches
        if: ${{ success() && env.OPERATION_COMPLETE != 'true' }}
        env:
          OPERATION: automatic
          MANIFEST_PATH: ${{ inputs.source_manifest }}
          OPERATION_DIR: ${{ runner.temp }}/sample-plan-operation
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
        run: python -I -S scripts/sample_operation.py
      - name: Publish one fully validated plan result
        if: ${{ success() && env.OPERATION_COMPLETE != 'true' }}
        env:
          OPERATION_DIR: ${{ runner.temp }}/sample-plan-operation
          GH_TOKEN: ${{ github.token }}
        run: timeout --kill-after=5s 180s python -I -S scripts/publish_match_samples.py --operation
      - name: Clean private operation workspace
        if: ${{ always() }}
        shell: bash
        env:
          OPERATION_DIR: ${{ runner.temp }}/sample-plan-operation
        run: rm -rf -- "$OPERATION_DIR"
