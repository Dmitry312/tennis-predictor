name: Manual year surface backfill (dry-run or apply)

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Season to process (2010-2026)'
        required: true
        type: string
        default: '2025'
      apply:
        description: 'Actually write NULL surfaces (false = dry-run)'
        required: true
        type: boolean
        default: false
      max_groups:
        description: 'Maximum tournament groups per run (5-100)'
        required: true
        type: choice
        options: ['5', '10', '20', '50', '100']
        default: '20'

permissions:
  contents: read

concurrency:
  group: tournament-surface-year-write
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: src/tennis_predictor/ingestion/nbbet/surface_backfill_year_write.py
      - name: Verify SSH configuration
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          GROUPS: ${{ inputs.max_groups }}
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_KEY" ]] || exit 1
          [[ "$SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 1
          [[ "$SSH_HOST" != *","* && "$SSH_HOST" != *[[:space:]]* ]] || exit 1
          [[ "$GROUPS" == 5 || "$GROUPS" == 10 || "$GROUPS" == 20 || "$GROUPS" == 50 || "$GROUPS" == 100 ]] || exit 1
          [[ "$YEAR" =~ ^20(1[0-9]|2[0-6])$ ]] || exit 1
      - name: Stream bounded backfill over pinned SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          GROUPS: ${{ inputs.max_groups }}
          APPLY: ${{ inputs.apply }}
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          umask 077
          d=$(mktemp -d "$RUNNER_TEMP/preview-ssh.XXXXXX")
          trap 'rm -rf -- "$d"' EXIT
          timeout 15s ssh-keyscan -T 15 -p 22 -t ed25519 -- "$SSH_HOST" > "$d/candidate" 2>/dev/null
          awk 'NF == 3 && $2 == "ssh-ed25519" {print; n++} END {if (n != 1) exit 1}' "$d/candidate" > "$d/known_hosts"
          actual=$(ssh-keygen -lf "$d/known_hosts" -E sha256 | awk '{print $2}')
          [[ "$actual" == "$SSH_FINGERPRINT" ]] || { echo "::error::SSH host key mismatch"; exit 1; }
          printf '%s\n' "$SSH_KEY" > "$d/key"
          remote_args="--year $YEAR --max-groups $GROUPS --pause 3"
          if [[ "$APPLY" == true ]]; then
            remote_args="$remote_args --apply"
          fi
          # The script comes from the selected main commit, not the deployed checkout.
          # Project imports resolve from the installed production source tree.
          timeout --kill-after=5s 1740s ssh -F /dev/null -T -p 22 \
            -o BatchMode=yes -o ConnectionAttempts=1 -o ConnectTimeout=15 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$d/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no -o VerifyHostKeyDNS=no -o IdentitiesOnly=yes \
            -o IdentityAgent=none -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -i "$d/key" \
            -l "$SSH_USER" -- "$SSH_HOST" \
            "cd /root/Tennis_pelmen_model && PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/root/Tennis_pelmen_model/src /root/Tennis_pelmen_model/.venv/bin/python -B - $remote_args" \
            < src/tennis_predictor/ingestion/nbbet/surface_backfill_year_write.py \
            > "$RUNNER_TEMP/surface-year-write.json"
          python -m json.tool "$RUNNER_TEMP/surface-year-write.json" > /dev/null
          # Report stays in artifact, not in workflow logs.
          echo "Backfill run completed. Download the report artifact."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tournament-surface-year-write-${{ github.run_id }}
          path: ${{ runner.temp }}/surface-year-write.json
          retention-days: 1
          if-no-files-found: error
