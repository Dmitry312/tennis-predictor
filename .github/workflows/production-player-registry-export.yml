name: Export player registry review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-player-registry-export
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ML' }}
    environment: player-identity-audit
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed runner dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.9
          uv sync --locked --group review
      - name: Read bounded match pages over the existing pinned SSH runtime
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && -n "$SSH_KEY" ]]
          [[ "$SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/registry-ssh.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          timeout 15s ssh-keyscan -T 10 -p 22 -t ed25519 -- "$SSH_HOST" > "$work/candidate" 2>/dev/null
          awk 'NF == 3 && $2 == "ssh-ed25519" { print; count++ }
               END { if (count != 1) exit 1 }' "$work/candidate" > "$work/known_hosts"
          actual=$(ssh-keygen -lf "$work/known_hosts" -E sha256 | awk '{print $2}')
          [[ "$actual" == "$SSH_FINGERPRINT" ]]
          printf '%s\n' "$SSH_KEY" > "$work/key"
          unset SSH_KEY
          PLAYER_REVIEW_SSH_DIR="$work" .venv/bin/python scripts/export_live_player_review.py "$RUNNER_TEMP/player-registry"
      - name: Deliver the completed Excel review workbook
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: player-registry-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/player-registry/player-review.xlsx
            ${{ runner.temp }}/player-registry/evidence.sqlite
          retention-days: 1
          if-no-files-found: error
      - name: Clean evidence and runner files
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/player-registry"
