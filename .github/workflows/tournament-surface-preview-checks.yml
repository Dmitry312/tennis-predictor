name: Tournament surface backfill preview checks

on:
  pull_request:
    paths:
      - 'src/tennis_predictor/ingestion/nbbet/surface_backfill_preview.py'
      - 'tests/test_surface_backfill_preview.py'
      - '.github/workflows/tournament-surface-preview-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install project and tests
        run: python -m pip install -e . pytest
      - name: Test preview and existing surface parser
        run: python -m pytest -q tests/test_surface_backfill_preview.py tests/test_nbbet_surface.py
      - name: Compile preview
        run: python -m py_compile src/tennis_predictor/ingestion/nbbet/surface_backfill_preview.py
