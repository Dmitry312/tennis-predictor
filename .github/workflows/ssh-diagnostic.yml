name: SSH authentication diagnostic
# Isolated check: never runs deployment commands.

on:
  push:
    branches:
      - ops/ssh-diagnostic-20261104
    paths:
      - .github/workflows/ssh-diagnostic.yml

permissions:
  contents: read

jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test SSH authentication only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 15s
          command_timeout: 15s
          script: whoami
