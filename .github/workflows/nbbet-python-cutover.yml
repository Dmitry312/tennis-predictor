name: Manual NB-Bet Python cutover

on:
  workflow_dispatch:
    inputs:
      expected_old_sha:
        description: "Current production HEAD (40 hex)"
        required: true
        type: string
      target_sha:
        description: "Reviewed main HEAD to deploy (40 hex)"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY_NBBET to confirm production code change"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nbbet-python-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_NBBET' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: infra/deploy
      - name: Verify inputs and SSH server identity; perform pinned cutover
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          OLD: ${{ inputs.expected_old_sha }}
          TARGET: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OLD" =~ ^[0-9a-f]{40}$ && "$TARGET" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_KEY" ]] || exit 2
          [[ "$SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || exit 2
          [[ "$SSH_HOST" != *","* && "$SSH_HOST" != *[[:space:]]* ]] || exit 2
          d=$(mktemp -d "$RUNNER_TEMP/nbbet-cutover.XXXXXX")
          trap 'rm -rf -- "$d"' EXIT
          timeout 15s ssh-keyscan -T 15 -p 22 -t ed25519 -- "$SSH_HOST" > "$d/candidate" 2>/dev/null
          awk 'NF == 3 && $2 == "ssh-ed25519" {print; n++} END {if (n != 1) exit 1}' "$d/candidate" > "$d/known_hosts"
          [[ "$(ssh-keygen -lf "$d/known_hosts" -E sha256 | awk '{print $2}')" == "$SSH_FINGERPRINT" ]] || exit 2
          printf '%s\n' "$SSH_KEY" > "$d/key"
          timeout --kill-after=5s 650s ssh -F /dev/null -T -p 22 \
            -o BatchMode=yes -o ConnectionAttempts=1 -o ConnectTimeout=15 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$d/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no -o VerifyHostKeyDNS=no -o IdentitiesOnly=yes \
            -o IdentityAgent=none -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes -i "$d/key" \
            -l "$SSH_USER" -- "$SSH_HOST" \
            "EXPECTED_OLD_SHA=$OLD TARGET_SHA=$TARGET bash -se" \
            < infra/deploy/nbbet_python_cutover.sh
