name: Offline Player Feature Engine
on:
  pull_request:
    branches: [ml-historical-baselines, ML]
    paths:
      - '.github/workflows/player-feature*.yml'
      - 'src/tennis_predictor/ml/**'
      - 'scripts/*historical_baselines.py'
      - 'scripts/run_player_features.py'
      - 'tests/test_rating_optimization.py'
      - 'tests/test_player_features.py'
      - 'tests/test_historical_baselines.py'
      - 'uv.lock'
  push:
    branches: [ml-player-feature-engine-v1]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check uv==0.13.9
          uv sync --locked --group baseline
      - run: |
          .venv/bin/ruff check src/tennis_predictor/ml/player_features src/tennis_predictor/ml/baselines scripts/*historical_baselines.py scripts/run_player_features.py tests/test_historical_baselines.py tests/test_rating_optimization.py tests/test_player_features.py
          .venv/bin/ruff format --check src/tennis_predictor/ml/player_features src/tennis_predictor/ml/baselines scripts/*historical_baselines.py scripts/run_player_features.py tests/test_historical_baselines.py tests/test_rating_optimization.py tests/test_player_features.py
          .venv/bin/python -m pytest -q tests/test_historical_baselines.py tests/test_rating_optimization.py tests/test_player_features.py tests/test_ratings.py tests/test_match_data.py
