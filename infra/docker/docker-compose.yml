services:
  app:
    # Замени OWNER/REPO на реальные владельца и имя репозитория (в нижнем регистре — так требует GHCR)
    image: ghcr.io/OWNER/REPO:latest
    env_file: ../../.env
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Порт 5432 наружу не пробрасываем: доступ локально только через SSH-туннель.

volumes:
  pgdata:
